<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AliAli (゜-゜)つロ 干杯~-aliali</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/video.css">
</head>
<body class="video-page">
  <div class="bili-header"><div id="header-bar-mount"></div></div>

  <div class="video-container-v1" id="app">
    <div class="left-container">
      <div class="video-info-container" id="video-info"></div>

        <div class="bpx-player-video-area" id="player"></div>
        <div class="bpx-player-sending-bar" id="sending-bar"></div>

      <div class="video-toolbar-container" id="toolbar"></div>

      <div class="video-tag-container" id="tags"></div>
      <div class="comment-container" id="comments"></div>
    </div>
    <div class="right-container">
      <div class="up-panel-container" id="up-panel"></div>
      <div id="video-pod"></div>
      <div class="danmaku-box" id="danmaku-box"></div>
      <div class="recommend-list" id="recommend"></div>
    </div>
  </div>
  <div id="footer"></div>

  <script src="/js/common.js"></script>
  <script src="/js/player.js"></script>
  <script src="/js/video.js"></script>
